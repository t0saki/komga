name: Build & Push (GHCR)

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering ref)
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-build
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          v=$(grep -E '^version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$v" ]; then
            echo "::error::could not read version from gradle.properties"
            exit 1
          fi
          sha=$(git rev-parse --short HEAD)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building komga **$v** at \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      # WebUI and NextUI pin different node versions (.nvmrc: 22 vs 24), and each
      # setup-web call re-pins the toolchain — so each must build right after its
      # own setup. Same ordering as upstream release.yml.
      - name: WebUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: WebUI - build
        working-directory: komga-webui
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: NextUI - Setup
        uses: ./.github/actions/setup-web
        with:
          working-directory: next-ui

      - name: NextUI - build
        working-directory: next-ui
        run: npm run build:with-i18n

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build jar
        run: ./gradlew :komga:webuiCopyIndex :komga:nextuiCopyIndex :komga:bootJar -x test

      - name: Stage docker context
        run: |
          set -euo pipefail
          jar=$(find komga/build/libs -name 'komga-*.jar' ! -name '*-plain.jar' | head -1)
          if [ -z "$jar" ]; then
            echo "::error::no bootJar found in komga/build/libs"
            ls -la komga/build/libs || true
            exit 1
          fi
          mkdir -p docker-ctx
          cp "$jar" docker-ctx/application.jar
          cp komga/docker/Dockerfile.fork docker-ctx/Dockerfile

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/komga
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.minor }}
            type=raw,value=sha-${{ steps.ver.outputs.sha }}
            type=raw,value=latest

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: docker-ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
